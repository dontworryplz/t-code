name: Packages

# Pull requests exercise every package format; v* tags also publish the collected artifacts.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install package builders and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman flatpak flatpak-builder jq desktop-file-utils xvfb xauth dbus-x11 squashfs-tools acl
      - name: Set up Snapcraft and LXD for strict core26 packaging
        run: |
          sudo snap install lxd
          sudo snap install snapcraft --classic --channel=9.x/stable
          sudo lxd init --auto
          sudo lxd waitready
          sudo setfacl -m "u:$(id -u):rw" /var/snap/lxd/common/lxd/unix.socket
      - name: Build every package and collect release artifacts
        run: packaging/build.sh
      - name: Package smoke tests
        run: packaging/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packaging/packages/release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packaging/packages/release/
      - name: Release with the packages
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/packages/release/*
          generate_release_notes: true
