# C, colored like VS Code Dark Modern with clangd's semantic highlighting.
# Later rules win where matches overlap, so the general ones come first.
filetype: c

detect:
    filename: "(\\.(c|C)$|\\.(h|H)$|\\.ii?$|\\.(def)$)"

rules:
    # Variables; PascalCase names are types (GtkWidget, App); ALL_CAPS names are enum constants.
    - identifier: "\\b[A-Za-z_][0-9A-Za-z_]*\\b"
    - type: "\\b[A-Z][0-9A-Z_]*[a-z][0-9A-Za-z_]*\\b"
    - identifier.constant: "\\b[A-Z_][0-9A-Z_]*[A-Z][0-9A-Z_]*\\b"

    # Named types: foo_t, struct/union/enum tags, FILE, GLib's lowercase typedefs.
    - type: "\\b[a-z_][0-9a-z_]*_t\\b"
    - type: "\\b(struct|union|enum)[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"
    - type: "\\b(FILE|DIR|va_list|jmp_buf|fd_set)\\b"
    - type: "\\bg(boolean|u?char|u?int(8|16|32|64)?|u?short|u?long|float|double|s?size|offset|intptr|uintptr|(const)?pointer|unichar2?|quark)\\b"

    # Function names (the "(" is recolored by the bracket rule), then macros: ALL_CAPS calls
    # and the standard object-like ones.
    - identifier.func: "\\b[A-Za-z_][0-9A-Za-z_]*[[:space:]]*\\("
    - identifier.macro: "\\b[A-Z_][0-9A-Z_]*[A-Z][0-9A-Z_]*[[:space:]]*\\("
    - identifier.macro: "\\b(stdin|stdout|stderr|errno|EOF|EXIT_SUCCESS|EXIT_FAILURE|BUFSIZ|PATH_MAX|NAME_MAX|RAND_MAX|CHAR_BIT|MB_LEN_MAX|SEEK_(SET|CUR|END)|__FILE__|__LINE__|__DATE__|__TIME__|__STDC_VERSION__|__cplusplus)\\b"
    - identifier.macro: "\\b(U?(CHAR|SHRT|INT|LONG|LLONG)|SCHAR|S?SIZE|U?INT(8|16|32|64|PTR|MAX)|PTRDIFF|WCHAR)_(MAX|MIN|WIDTH)\\b"
    - identifier.macro: "\\b((FLT|DBL|LDBL)_[A-Z_]+|M_[0-9A-Z_]+|SIG[0-9A-Z_]+|O_[A-Z]+|S_I[A-Z]+|E(INTR|AGAIN|WOULDBLOCK|NOENT|EXIST|INVAL|NOMEM|ACCES|PERM|BADF|PIPE|NOTDIR|ISDIR|NOSPC|RANGE|DOM|BUSY|CHILD|IO|NOSYS)|G_SOURCE_(REMOVE|CONTINUE)|GDK_EVENT_(STOP|PROPAGATE))\\b"
    - identifier.macro: "\\b(assert|offsetof|va_(start|arg|end|copy)|setjmp)\\b"

    # Goto labels.
    - identifier.label: "^[[:space:]]*[A-Za-z_][0-9A-Za-z_]*[[:space:]]*:([^:]|$)"

    # Preprocessor conditions and the macro being defined are blue, like VS Code's meta.preprocessor.
    - preproc.line: "^[[:space:]]*#[[:space:]]*(el)?if\\b.*"
    - preproc.line: "^[[:space:]]*#[[:space:]]*((el)?ifn?def|undef|define)[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"
    - identifier.attr: "^[[:space:]]*#[[:space:]]*pragma[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"

    # Operators are a shade brighter than punctuation (".", "->", ";", ",").
    - symbol.operator: "[-+*/%=<>~&|^!?:]"
    - symbol: "[.;,]|->"
    - symbol.brackets: "[(){}]|\\[|\\]"

    # storage.type / storage.modifier are italic in the user's VS Code setup.
    - type.keyword: "\\b(char|int|short|long|float|double|void|bool|_Bool|(un)?signed|_BitInt|_Complex|_Imaginary|_Decimal(32|64|128)|struct|union|enum|asm)\\b"
    - type.keyword: "\\b(auto|const|constexpr|extern|register|restrict|static|volatile|inline|_Noreturn|_Atomic|_Thread_local|thread_local)\\b"
    - keyword: "\\b(typedef|sizeof|typeof|typeof_unqual|_Alignof|alignof|_Alignas|alignas|_Generic|_Static_assert|static_assert)\\b"
    - keyword: "__attribute__|__(aligned|asm|builtin|extension|hidden|inline|packed|restrict|section|typeof|weak)__"

    # Control flow (keyword.control).
    - statement: "\\b(for|if|while|do|else|case|default|switch|goto|continue|break|return|_Pragma)\\b"

    - constant.number: "(\\b([1-9][0-9]*|0[0-7]*|0[Xx][0-9A-Fa-f]+|0[Bb][01]+)([Uu][Ll]?[Ll]?|[Ll][Ll]?[Uu]?|[Uu]?[Ww][Bb]|[Ww][Bb][Uu])?\\b)"
    - constant.number: "(\\b(([0-9]*[.][0-9]+|[0-9]+[.][0-9]*)([Ee][+-]?[0-9]+)?|[0-9]+[Ee][+-]?[0-9]+)[FfLl]?\\b)"
    - constant.number: "(\\b0[Xx]([0-9A-Za-z]*[.][0-9A-Za-z]+|[0-9A-Za-z]+[.][0-9A-Za-z]*)[Pp][+-]?[0-9]+[FfLl]?\\b)"
    - constant.bool: "\\b(true|false|NULL|nullptr|TRUE|FALSE)\\b"

    # Preprocessor: the header name is a string, the directive itself is keyword.control.
    - constant.string: "^[[:space:]]*#[[:space:]]*include[[:space:]]*<[^>]*>"
    - preproc: "^[[:space:]]*#[[:space:]]*(define|embed|pragma|include|include_next|(un|ifn?)def|endif|el(if|ifdef|ifndef|se)|if|line|warning|error)\\b"
    - preproc: "\\bdefined\\b"

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.placeholder: "%[-+ #0]*([0-9]+|\\*)?(\\.([0-9]+|\\*))?(hh|h|ll|l|j|z|t|L)?[diouxXeEfFgGaAcspn%]"
            - constant.specialChar: "\\\\([\"'abfnrtv\\\\?]|[0-3]?[0-7]{1,2}|x[0-9A-Fa-f]{1,2}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8})"

    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\([\"'abfnrtv\\\\?]|[0-3]?[0-7]{1,2}|x[0-9A-Fa-f]{1,2})"

    - comment:
        start: "//"
        end: "$"
        rules:
            - type.keyword: "[\\\\@](brief|param|tparam|return|returns|retval|note|warning|see|sa|code|endcode|file|author|deprecated|todo|throws?|pre|post|details|ref)\\b"

    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            - type.keyword: "[\\\\@](brief|param|tparam|return|returns|retval|note|warning|see|sa|code|endcode|file|author|deprecated|todo|throws?|pre|post|details|ref)\\b"
