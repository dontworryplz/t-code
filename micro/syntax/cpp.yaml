# C++, colored like VS Code Dark Modern with clangd's semantic highlighting.
# Later rules win where matches overlap, so the general ones come first.
filetype: c++

detect:
    filename: "(\\.c(c|pp|xx|\\+\\+)$|\\.h(h|pp|xx|\\+\\+)?$|\\.(ipp|tpp|inl|ii|cu|cuh)$)"
    signature: "\\b(namespace|class|public|protected|private|template|typename|constexpr|noexcept|nullptr|throw|std::)\\b"

rules:
    # Variables; PascalCase names and template parameters (T, U) are types; ALL_CAPS names are
    # enum constants.
    - identifier: "\\b[A-Za-z_][0-9A-Za-z_]*\\b"
    - type: "\\b[A-Z][0-9A-Z_]*[a-z][0-9A-Za-z_]*\\b"
    - type: "\\b[A-Z][0-9]?\\b"
    - identifier.constant: "\\b[A-Z_][0-9A-Z_]*[A-Z][0-9A-Z_]*\\b"

    # Named types: foo_t, class/struct/enum/namespace names, std:: types.
    - type: "\\b[a-z_][0-9a-z_]*_t\\b"
    - type: "\\b(class|struct|union|enum|namespace|typename|concept)[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"
    - type: "\\bstd::[A-Za-z_][0-9A-Za-z_]*"
    - type: "\\b(FILE|va_list|jmp_buf)\\b"
    - identifier: "\\bstd::(cout|cerr|clog|cin|wcout|wcerr|wcin|nullopt|npos|ignore|in_place|nothrow)\\b"

    # Function names (the "(" is recolored by the bracket rule), then macros.
    - identifier.func: "\\b[A-Za-z_][0-9A-Za-z_]*[[:space:]]*\\("
    - identifier.func: "\\bstd::(endl|flush|ws|ends)\\b"
    - identifier.macro: "\\b[A-Z_][0-9A-Z_]*[A-Z][0-9A-Z_]*[[:space:]]*\\("
    - identifier.macro: "\\b(stdin|stdout|stderr|errno|EOF|EXIT_SUCCESS|EXIT_FAILURE|BUFSIZ|PATH_MAX|RAND_MAX|CHAR_BIT|SEEK_(SET|CUR|END)|__FILE__|__LINE__|__DATE__|__TIME__|__cplusplus)\\b"
    - identifier.macro: "\\b(U?(CHAR|SHRT|INT|LONG|LLONG)|SCHAR|S?SIZE|U?INT(8|16|32|64|PTR|MAX)|PTRDIFF)_(MAX|MIN)\\b|\\b((FLT|DBL|LDBL)_[A-Z_]+|M_[0-9A-Z_]+|SIG[0-9A-Z_]+)\\b"
    - identifier.macro: "\\b(assert|offsetof|va_(start|arg|end|copy))\\b"

    # Enumerators of E_ enums (E_Color::Red), then scope qualifiers (std::, Foo::).
    - identifier.constant: "\\bE_[0-9A-Za-z_]+::[A-Za-z_][0-9A-Za-z_]*"
    - type: "\\b[A-Za-z_][0-9A-Za-z_]*::"

    # Goto labels (access specifiers are recolored below).
    - identifier.label: "^[[:space:]]*[A-Za-z_][0-9A-Za-z_]*[[:space:]]*:([^:]|$)"

    # Attributes: [[nodiscard]].
    - identifier.attr: "\\[\\[[^\\]]*\\]\\]"

    # Preprocessor conditions and the macro being defined are blue, like VS Code's meta.preprocessor.
    - preproc.line: "^[[:space:]]*#[[:space:]]*(el)?if\\b.*"
    - preproc.line: "^[[:space:]]*#[[:space:]]*((el)?ifn?def|undef|define)[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"
    - identifier.attr: "^[[:space:]]*#[[:space:]]*pragma[[:space:]]+[A-Za-z_][0-9A-Za-z_]*"

    # Operators are a shade brighter than punctuation (".", "->", "::", ";", ",").
    - symbol.operator: "[-+*/%=<>~&|^!?:]"
    - symbol: "[.;,]|->|::"
    - symbol.brackets: "[(){}]|\\[|\\]"

    # "*" and "&" after a built-in type are storage.modifier.pointer/reference.
    - type.keyword: "\\b(auto|void|bool|char(8_t|16_t|32_t)?|wchar_t|int|short|long|float|double|(un)?signed)[[:space:]]*[*&]+"

    # storage.type / storage.modifier are italic in the user's VS Code setup.
    - type.keyword: "\\b(auto|void|bool|char(8_t|16_t|32_t)?|wchar_t|int|short|long|float|double|(un)?signed|class|struct|union|enum|namespace|template|typename|asm)\\b"
    - type.keyword: "\\b(const|constexpr|consteval|constinit|static|extern|inline|volatile|register|mutable|explicit|virtual|friend|thread_local|override|final|public|private|protected)\\b"
    - keyword: "\\b(typedef|sizeof|alignof|alignas|typeid|decltype|noexcept|static_assert|concept|requires|(static|dynamic|reinterpret|const)_cast)\\b"
    - keyword.other: "\\b(using|operator|new|delete)\\b"
    - identifier.this: "\\bthis\\b"

    # Control flow (keyword.control).
    - statement: "\\b(for|if|while|do|else|case|default|switch|goto|continue|break|return|try|catch|throw|co_await|co_return|co_yield)\\b"

    - constant.number: "(\\b([1-9][0-9']*|0[0-7']*|0[Xx][0-9A-Fa-f']+|0[Bb][01']+)([Uu][Ll]?[Ll]?|[Ll][Ll]?[Uu]?|[Uu]?[Zz]|[Zz][Uu])?\\b)"
    - constant.number: "(\\b(([0-9']*[.][0-9']+|[0-9']+[.][0-9']*)([Ee][+-]?[0-9]+)?|[0-9']+[Ee][+-]?[0-9]+)[FfLl]?\\b)"
    - constant.number: "(\\b0[Xx]([0-9A-Za-z]*[.][0-9A-Za-z]+|[0-9A-Za-z]+[.][0-9A-Za-z]*)[Pp][+-]?[0-9]+[FfLl]?\\b)"
    - constant.bool: "\\b(true|false|NULL|nullptr)\\b"

    # Preprocessor: the header name is a string, the directive itself is keyword.control.
    - constant.string: "^[[:space:]]*#[[:space:]]*include[[:space:]]*<[^>]*>"
    - preproc: "^[[:space:]]*#[[:space:]]*(define|pragma|include|include_next|(un|ifn?)def|endif|el(if|ifdef|ifndef|se)|if|line|warning|error)\\b"
    - preproc: "\\bdefined\\b"

    - constant.string:
        start: "\\bR\"[^(\"[:space:]]*\\("
        end: "\\)[^)\"[:space:]]*\""
        rules: []

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.placeholder: "%[-+ #0]*([0-9]+|\\*)?(\\.([0-9]+|\\*))?(hh|h|ll|l|j|z|t|L)?[diouxXeEfFgGaAcspn%]|\\{[0-9]*(:[^{}\"]*)?\\}"
            - constant.specialChar: "\\\\([\"'abfnrtv\\\\?]|[0-3]?[0-7]{1,2}|x[0-9A-Fa-f]{1,2}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8})"

    # "\B" keeps digit separators (1'000) from opening a character literal.
    - constant.string:
        start: "\\B'"
        end: "'"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\([\"'abfnrtv\\\\?]|[0-3]?[0-7]{1,2}|x[0-9A-Fa-f]{1,2})"

    - comment:
        start: "//"
        end: "$"
        rules:
            - type.keyword: "[\\\\@](brief|param|tparam|return|returns|retval|note|warning|see|sa|code|endcode|file|author|deprecated|todo|throws?|pre|post|details|ref)\\b"

    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            - type.keyword: "[\\\\@](brief|param|tparam|return|returns|retval|note|warning|see|sa|code|endcode|file|author|deprecated|todo|throws?|pre|post|details|ref)\\b"
